global:  
  deployDatabase: false # Disable the bundled PostgreSQL database

frontend:
  ingress:
    enabled: true
    host: "kapitelshelf.example.com"
    path: /

api:
  ingress:
    enabled: true
    host: "kapitelshelf.example.com"
    path: /api

database:
  auth:
    username: "<POSTGRES_USERNAME>"
    password: "<POSTGRES_PASSWORD>"

  service:
    # Set the host and port to the external PostgreSQL instance
    host: "<POSTGRES_HOST>"
    port: 5432


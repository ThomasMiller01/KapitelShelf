global:  
  namespace: my-namespace

  storage:
    size: 20Gi

frontend:
  image:
    repository: thomasmiller01/kapitelshelf-frontend
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    port: 5173

  ingress:
    enabled: true
    annotations:
      # You can use Cert-Manager for SSL certs
      cert-manager.io/issuer: acme-issuer
      cert-manager.io/issuer-kind: ClusterIssuer
    host: "kapitelshelf.example.com"
    path: /
    tls:
      - hosts:
          - "kapitelshelf.example.com"
        secretName: my-domain-cert
    className: nginx

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi

api:
  image:
    repository: thomasmiller01/kapitelshelf-api    
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    port: 5261

  ingress:
    enabled: true
    annotations:
      # You can use CertManager for SSL certs
      cert-manager.io/issuer: acme-issuer
      cert-manager.io/issuer-kind: ClusterIssuer
    host: "kapitelshelf.example.com"
    path: /api
    tls:
      - hosts:
          - "kapitelshelf.example.com"
        secretName: my-domain-cert
    className: nginx

  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

database:
  auth:
    username: "<POSTGRES_USERNAME>"
    password: "<POSTGRES_PASSWORD>"

  service:
    port: 5432

  persistence:
    size: 20Gi

  resources:
    limits:
      memory: 2Gi
